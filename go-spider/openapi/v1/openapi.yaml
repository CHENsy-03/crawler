openapi: 3.1.0
info:
  title: Crawler External API
  version: 1.0.0
  description: DEV-003 frozen /api/v1 external contract.
servers:
  - url: /api/v1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
  - name: Bootstrap
  - name: Authentication
  - name: Dashboard
  - name: Tasks
  - name: Results
  - name: Export
  - name: Sites
  - name: Plugins
  - name: System
paths:
  /bootstrap/status:
    get:
      operationId: getBootstrapStatus
      description: getBootstrapStatus endpoint.
      tags: [Bootstrap]
      security: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: getBootstrapStatus success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BootstrapStatusResponse"}
        '409':
          description: already_initialized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getBootstrapStatus_409"}
      x-errors:
        - already_initialized

  /bootstrap:
    post:
      operationId: bootstrapSystem
      description: bootstrapSystem endpoint.
      tags: [Bootstrap]
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BootstrapRequest"}
      responses:
        '200':
          description: bootstrapSystem success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BootstrapResultResponse"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_bootstrapSystem_400"}
        '409':
          description: already_initialized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_bootstrapSystem_409"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_bootstrapSystem_401"}
      x-errors:
        - unauthorized
        - validation_error
        - already_initialized
        - state_conflict
        - idempotency_conflict

  /auth/login:
    post:
      operationId: login
      description: login endpoint.
      tags: [Authentication]
      security: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        '200':
          description: login success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionResponse"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_login_400"}
        '401':
          description: invalid_credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_login_401"}
        '429':
          description: over_limit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_login_429"}
      x-errors:
        - validation_error
        - invalid_credentials
        - over_limit

  /auth/logout:
    post:
      operationId: logout
      description: logout endpoint.
      tags: [Authentication]
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '204':
          description: logout success
          content: {}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_logout_401"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_logout_403"}
      x-errors:
        - unauthorized
        - csrf_failed

  /auth/session:
    get:
      operationId: getCurrentSession
      description: getCurrentSession endpoint.
      tags: [Authentication]
      security:
        - SessionCookie: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: getCurrentSession success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionResponse"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getCurrentSession_401"}
      x-errors:
        - unauthorized

  /auth/tokens:
    get:
      operationId: listApiTokens
      description: listApiTokens endpoint.
      tags: [Authentication]
      security:
        - SessionCookie: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: listApiTokens success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiTokenListResponse"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_listApiTokens_401"}
      x-errors:
        - unauthorized

    post:
      operationId: createApiToken
      description: createApiToken endpoint.
      tags: [Authentication]
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiTokenCreateRequest"}
      responses:
        '201':
          description: createApiToken success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiTokenCreatedResponse"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createApiToken_400"}
        '429':
          description: token_limit_exceeded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createApiToken_429"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createApiToken_403"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createApiToken_401"}
        '409':
          description: idempotency_conflict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createApiToken_409"}
      x-errors:
        - unauthorized
        - validation_error
        - token_limit_exceeded
        - csrf_failed
        - idempotency_conflict

  /auth/tokens/{tokenId}:
    delete:
      operationId: deleteApiToken
      description: deleteApiToken endpoint.
      tags: [Authentication]
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: tokenId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ULID"}
      responses:
        '204':
          description: deleteApiToken success
          content: {}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_deleteApiToken_401"}
        '404':
          description: not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_deleteApiToken_404"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_deleteApiToken_403"}
      x-errors:
        - unauthorized
        - not_found
        - csrf_failed

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      description: getDashboardOverview endpoint.
      tags: [Dashboard]
      security:
        - SessionCookie: []
        - BearerAuth: []
      x-required-api-token-scopes: ["dashboard:read"]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: getDashboardOverview success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DashboardOverviewResponse"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getDashboardOverview_401"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getDashboardOverview_400"}
        '403':
          description: security_policy_rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getDashboardOverview_403"}
      x-errors:
        - unauthorized
        - security_policy_rejected
        - validation_error

  /tasks:
    get:
      operationId: listTasks
      description: listTasks endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:read"]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: listTasks success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskListResponse"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_listTasks_400"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_listTasks_401"}
        '403':
          description: security_policy_rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_listTasks_403"}
      x-errors:
        - validation_error
        - unauthorized
        - security_policy_rejected

    post:
      operationId: createTask
      description: createTask endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
          CsrfHeader: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskCreateRequest"}
      responses:
        '201':
          description: createTask success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskCreatedResponse"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createTask_400"}
        '404':
          description: site_not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createTask_404"}
        '422':
          description: task_limit_exceeded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createTask_422"}
        '409':
          description: idempotency_conflict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createTask_409"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createTask_401"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_createTask_403"}
      x-errors:
        - unauthorized
        - security_policy_rejected
        - validation_error
        - site_not_found
        - task_limit_exceeded
        - idempotency_conflict
        - csrf_failed

  /tasks/{taskId}/scope-suggestion:
    post:
      operationId: suggestTaskScope
      description: suggestTaskScope endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
          CsrfHeader: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: taskId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ULID"}
      responses:
        '200':
          description: suggestTaskScope success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScopeSuggestionResponse"}
        '404':
          description: task_not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_suggestTaskScope_404"}
        '409':
          description: state_conflict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_suggestTaskScope_409"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_suggestTaskScope_400"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_suggestTaskScope_401"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_suggestTaskScope_403"}
      x-errors:
        - unauthorized
        - security_policy_rejected
        - task_not_found
        - state_conflict
        - validation_error
        - idempotency_conflict
        - csrf_failed

  /tasks/{taskId}/confirm:
    post:
      operationId: confirmTask
      description: confirmTask endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
          CsrfHeader: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: taskId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ULID"}
      responses:
        '200':
          description: confirmTask success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskResponse"}
        '404':
          description: task_not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_confirmTask_404"}
        '409':
          description: state_conflict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_confirmTask_409"}
        '422':
          description: task_limit_exceeded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_confirmTask_422"}
        '429':
          description: over_limit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_confirmTask_429"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_confirmTask_401"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_confirmTask_403"}
      x-errors:
        - unauthorized
        - security_policy_rejected
        - task_not_found
        - state_conflict
        - task_limit_exceeded
        - over_limit
        - idempotency_conflict
        - csrf_failed

  /tasks/{taskId}:
    get:
      operationId: getTask
      description: getTask endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:read"]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: taskId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ULID"}
      responses:
        '200':
          description: getTask success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskResponse"}
        '404':
          description: task_not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getTask_404"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getTask_401"}
        '403':
          description: security_policy_rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_getTask_403"}
      x-errors:
        - task_not_found
        - unauthorized
        - security_policy_rejected

  /tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      description: cancelTask endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
          CsrfHeader: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: taskId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ULID"}
      responses:
        '200':
          description: cancelTask success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskResponse"}
        '404':
          description: task_not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_cancelTask_404"}
        '409':
          description: state_conflict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_cancelTask_409"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_cancelTask_401"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_cancelTask_403"}
      x-errors:
        - unauthorized
        - security_policy_rejected
        - task_not_found
        - state_conflict
        - already_terminal
        - idempotency_conflict
        - csrf_failed

  /tasks/{taskId}/retry:
    post:
      operationId: retryTask
      description: retryTask endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
          CsrfHeader: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: taskId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ULID"}
      responses:
        '201':
          description: retryTask success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskCreatedResponse"}
        '404':
          description: task_not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_retryTask_404"}
        '409':
          description: state_conflict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_retryTask_409"}
        '422':
          description: task_limit_exceeded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_retryTask_422"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_retryTask_401"}
        '403':
          description: csrf_failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_retryTask_403"}
      x-errors:
        - unauthorized
        - security_policy_rejected
        - task_not_found
        - state_conflict
        - already_terminal
        - task_limit_exceeded
        - idempotency_conflict
        - csrf_failed

  /tasks/{taskId}/events:
    get:
      operationId: streamTaskEvents
      description: streamTaskEvents endpoint.
      tags: [Tasks]
      security:
        - SessionCookie: []
        - BearerAuth: []
      x-required-api-token-scopes: ["tasks:read"]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: Last-Event-ID
          in: header
          required: false
          description: Canonical TaskEvent ULID for SSE resumption.
          schema: {$ref: "#/components/schemas/ULID"}
        - name: taskId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ULID"}
      responses:
        '200':
          description: streamTaskEvents success
          content:
            text/event-stream:
              schema: {type: string}
        '404':
          description: task_not_found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_streamTaskEvents_404"}
        '410':
          description: event_history_expired
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_streamTaskEvents_410"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_streamTaskEvents_401"}
        '403':
          description: security_policy_rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_streamTaskEvents_403"}
      x-errors:
        - task_not_found
        - event_history_expired
        - unauthorized
        - security_policy_rejected
      x-sse-event-schemas:
        task_status_changed: sse/task_status_changed.schema.json
        stage_progress: sse/stage_progress.schema.json
        worker_lost: sse/worker_lost.schema.json
        result_persisted: sse/result_persisted.schema.json
        task_error: sse/task_error.schema.json
        export_finished: sse/export_finished.schema.json

  /results:
    get:
      operationId: listResults
      description: listResults endpoint.
      tags: [Results]
      security:
        - SessionCookie: []
        - BearerAuth: []
      x-required-api-token-scopes: ["results:read"]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: {type: string, maxLength: 128}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          description: Opaque cursor, mutually exclusive with page.
          schema: {type: string, maxLength: 512}
        - name: sort
          in: query
          schema: {type: string, enum: [persisted_at, relevance_score, quality_score]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      x-mutually-exclusive-parameters: [page, cursor]
      x-contract-invariants: ["RESULT_NEXT_CURSOR_NULL_WHEN_NO_NEXT","RESULT_TOTAL_EXACT_REQUIRES_COUNTED_AT","RESULT_SORT_UNIQUE_TASK_ARTICLE_ID_TAIL"]
      responses:
        '200':
          description: listResults success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResultListResponse"}
        '400':
          description: validation_error
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_listResults_400"}
        '401':
          description: unauthorized
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_listResults_401"}
        '403':
          description: security_policy_rejected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope_listResults_403"}
      x-errors:
        - validation_error
        - unauthorized
        - security_policy_rejected

  /results/{taskArticleId}:
    get:
      operationId: getResult
      description: getResult endpoint.
      tags: [Results]
      security:
        - SessionCookie: []
        - BearerAuth: []
